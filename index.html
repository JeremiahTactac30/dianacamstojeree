<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A wedding planner with budget, guest list, tasks, seating, calendar and day-of timeline.">
<title>Wedding Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="rail">
    <div class="mast" id="mast"></div>
    <nav id="nav" aria-label="Planner sections"></nav>
  </div>
  <main class="main" id="view" tabindex="-1"></main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="gate" id="gate" hidden>
  <form class="gcard" id="gform">
    <h2>Owner sign in</h2>
    <p>Enter the passcode to edit this planner on this device.</p>
    <input id="gpass" type="password" autocomplete="current-password" aria-label="Passcode">
    <button class="btn pri" type="submit">Open planner</button>
    <button class="btn" type="button" id="gcancel">Continue as visitor</button>
    <p class="gerr" id="gerr" role="alert"></p>
  </form>
</div>
<script src="script.js"></script>
</body>
</html>
